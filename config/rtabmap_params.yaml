# ============================================================
#  RTAB-Map Configuration — parameters optimized for drone use
#  Documentation: https://github.com/introlab/rtabmap_ros
#
#  RTAB-Map (Real-Time Appearance-Based Mapping) is a SLAM system
#  that uses RGB-D images for:
#    1. Visual odometry (local position estimation)
#    2. Loop closure (recognizing previously visited areas)
#    3. 3D map building (point cloud + occupancy grid)
#
#  Two main nodes:
#    - rtabmap_odom::RGBDOdometry  → fast visual odometry (SLAM frontend)
#    - rtabmap_slam::Rtabmap       → full SLAM with loop closure (backend)
# ============================================================

# ── Visual Odometry Node (RGBDOdometry) ───────────────────────
rgbd_odometry_node:
  ros__parameters:
    # The robot's body frame (drone center of mass)
    frame_id: "base_link"

    # The odometry frame (fixed at startup position)
    odom_frame_id: "odom"

    # Approximate topic synchronization (camera topics are not perfectly synced)
    approx_sync: true

    # Maximum sync interval (seconds) — 20ms for 20fps camera
    approx_sync_max_interval: 0.02

    # Wait for IMU before initializing orientation (important for drones)
    wait_imu_to_init: true

    # ── Odometry Strategy ───────────────────────────────────
    # "0" = Frame-to-Map (more robust, recommended for drones)
    # "1" = Frame-to-Frame (faster, but more drift)
    Odom/Strategy: "0"

    # Visual feature detection (keypoints)
    # GFTT = Good Features to Track (Harris + Shi-Tomasi corners)
    Vis/FeatureType: "6"        # GFTT detector
    GFTT/MinDistance: "5"       # minimum distance between keypoints (pixels)
    GFTT/QualityLevel: "0.001"  # keypoint quality threshold

    # Minimum number of matched points for a valid motion estimate
    Vis/MinInliers: "10"

    # Maximum allowed inlier reprojection distance (in meters)
    Vis/InlierDistance: "0.1"

    # Maximum size of the local keyframe map (Frame-to-Map)
    OdomF2M/MaxSize: "1000"

# ── Full SLAM Node (Rtabmap backend) ──────────────────────────
rtabmap_node:
  ros__parameters:
    frame_id: "base_link"

    # Subscribe to RGB + Depth separately (not as a combined RGBD stream)
    subscribe_rgb: true
    subscribe_depth: true

    # Also receive odometry covariance info from the odometry node
    subscribe_odom_info: true

    # Approximate synchronization between topics
    approx_sync: true

    # Incremental memory: continuously adds new locations to memory (mapping mode)
    # Set to "false" for localization-only mode (no new nodes added)
    Mem/IncrementalMemory: "true"

    # Do not pre-populate working memory with all nodes at startup (fresh start)
    Mem/InitWMWithAllNodes: "false"

    # Spatial loop closure in addition to visual loop closure
    RGBD/ProximityBySpace: "true"

    # Update the map only on significant motion (saves CPU on drone)
    # Linear: at least 1cm of movement before updating
    RGBD/LinearUpdate: "0.01"
    # Angular: at least ~0.57 degrees of rotation before updating
    RGBD/AngularUpdate: "0.01"

    # Maximum time budget per SLAM backend iteration (milliseconds)
    # 700ms = ~1.4 Hz for backend (acceptable — odometry runs much faster)
    Rtabmap/TimeThr: "700"

    # Maximum number of visual features per image (CPU vs. accuracy trade-off)
    Kp/MaxFeatures: "400"

    # Loop closure detection using a visual vocabulary (Bag of Words)
    Kp/DetectorStrategy: "6"   # GFTT (consistent with odometry node)
