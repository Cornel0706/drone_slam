# ============================================================
#  Luxonis OAK-S2 Camera Parameters
#  Documentation: https://docs.luxonis.com/software/ros/depthai-ros/
#
#  The OAK-S2 is a stereo camera with an integrated IMU (BMI270).
#  This configuration is optimized for drone use:
#    - Reduced resolution (720P RGB, 640x400 stereo) → low CPU usage
#    - 20 FPS → sufficient for SLAM without overloading the RPi5
#    - IMU at 200 Hz → essential for EKF sensor fusion
#    - Depth aligned with RGB → easy to use in RTAB-Map
# ============================================================

camera:
  ros__parameters:

    # ── Pipeline ──────────────────────────────────────────────
    camera:
      # RGBD = RGB + Depth (stereo)
      i_pipeline_type: "RGBD"

      # Camera frame name in the TF tree
      i_tf_camera_name: "oak"

      # Parent frame (drone body center)
      i_tf_parent_frame: "base_link"

      # IR disabled (outdoor use, natural light is sufficient)
      i_enable_ir: false

      # Neural network disabled (saves CPU resources)
      i_nn_type: "none"

      # Empty device ID = automatically picks the first USB device found
      i_device_id: ""

    # ── RGB Camera (central color sensor) ─────────────────────
    rgb:
      # 720P = 1280x720 px — good balance of quality vs. performance
      i_resolution: "720P"

      # 20 frames per second — sufficient for visual SLAM
      i_fps: 20

      # Publish the RGB topic
      i_publish_topic: true

      # Non-interleaved (full frames, not alternating)
      i_interleaved: false

    # ── Stereo Camera (left-right pair for depth estimation) ───
    stereo:
      # Resolution: 640x400 px (OV7251 sensors)
      i_width: 640
      i_height: 400

      # Align the depth image to the RGB frame (same coordinate frame)
      i_align_depth: true

      # HIGH_ACCURACY = fewer artifacts, slightly slower
      # HIGH_DENSITY  = faster, more holes in the depth map
      i_depth_preset: "HIGH_ACCURACY"

      # Left-Right consistency check: removes ambiguous depth pixels
      i_lr_check: true

      # Publish the depth map
      i_output_depth: true

      # Subpixel mode = higher precision at longer distances
      i_subpixel: true

    # ── IMU (BMI270: Accelerometer + Gyroscope) ────────────────
    imu:
      # Enable IMU publishing
      i_enable_imu: true

      # 200 Hz = standard frequency for drone EKF fusion
      i_acc_freq: 200
      i_gyro_freq: 200

      # Send data on every sample (minimizes latency)
      i_batch_report_threshold: 1
      i_max_batch_reports: 10
